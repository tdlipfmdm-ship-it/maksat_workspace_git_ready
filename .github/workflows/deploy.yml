name: Maksat Workspace CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Kody barlap almak (Checkout repository)
      uses: actions/checkout@v4

    - name: Python Gurşawyny Gurmak
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Gerekli Kitaphanalary Gurnamak
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Docker Gurulmasyny Barlamak
      run: |
        docker compose config
        docker compose build
