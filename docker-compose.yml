version: '3.8'

services:
  # 1. Reverse Proxy & SSL Gateway (Nginx)
  proxy:
    image: nginx:alpine
    container_name: maksat_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  # 2. FastAPI Backend & DICOM Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maksat_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://maksat_user:secure_pass_2026@postgres:5432/maksat_db
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY=maksat_s3_admin
      - S3_SECRET_KEY=maksat_s3_secret_key_2026
    volumes:
      - dicom_data:/data/storage
    depends_on:
      - postgres
      - minio

  # 3. Goralan Maglumatlar Bazasy (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: maksat_postgres
    restart: always
    environment:
      POSTGRES_USER: maksat_user
      POSTGRES_PASSWORD: secure_pass_2026
      POSTGRES_DB: maksat_db
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # 4. S3 Lukmançylyk Ammary (MinIO Object Storage)
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: maksat_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: maksat_s3_admin
      MINIO_ROOT_PASSWORD: maksat_s3_secret_key_2026
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
  dicom_data:
